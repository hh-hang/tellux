<!doctype html>
<html lang="zh-CN" class="portal-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      data-i18n-attr="content:gallery.meta.description"
      content="基于 Tellux 构建的社区优秀案例合集：数字地球、数字孪生、三维地图与行业应用。"
    />
    <title data-i18n="gallery.meta.title">Tellux 社区作品</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./gallery.ts"></script>
  </head>
  <body class="portal-page">
    <main class="portal portal-gallery">
      <header class="portal-gallery__nav">
        <nav
          class="portal-nav"
          data-i18n-attr="aria-label:portal.nav.aria"
          aria-label="Tellux 网站导航"
        >
          <a
            class="portal-brand"
            href="./index.html"
            data-i18n-attr="aria-label:portal.nav.homeAria"
            aria-label="Tellux 首页"
          >
            <span class="portal-brand__mark" aria-hidden="true">T</span>
            <span>Tellux</span>
          </a>
          <div class="portal-nav__links">
            <a data-docs-link href="./docs/" data-i18n="portal.nav.docs">文档</a>
            <a href="./sandcastle.html" data-i18n="portal.nav.examples">示例</a>
            <span aria-current="page" data-i18n="portal.nav.showcase">社区作品</span>
            <div data-lang-toggle></div>
            <a
              class="portal-nav__github"
              href="https://github.com/cyanfish-x/tellux"
              data-i18n-attr="aria-label:portal.nav.github"
              aria-label="GitHub"
            >
              <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" focusable="false">
                <path
                  fill-rule="evenodd"
                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
                />
              </svg>
            </a>
          </div>
        </nav>
      </header>

      <section
        class="portal-gallery__toolbar"
        data-gallery
        data-i18n-attr="aria-label:gallery.toolbarAria"
        aria-label="搜索与筛选社区案例"
      >
        <div class="gallery-search">
          <input
            type="search"
            data-gallery-search
            autocomplete="off"
            spellcheck="false"
            data-i18n-attr="placeholder:gallery.searchPlaceholder,aria-label:gallery.searchAria"
            placeholder="搜索案例标题或描述"
            aria-label="搜索社区案例"
          />
        </div>
        <div
          class="gallery-tags"
          data-gallery-tags
          role="group"
          data-i18n-attr="aria-label:gallery.tagsAria"
          aria-label="按标签筛选"
        ></div>
        <p class="gallery-count" data-gallery-count aria-live="polite"></p>
      </section>

      <section class="portal-gallery__content">
        <div
          class="portal-community__empty"
          data-gallery-empty-all
          hidden
          data-i18n-attr="aria-label:portal.community.emptyAria"
          aria-label="暂无社区案例"
        >
          <p data-i18n="portal.community.empty">
            还没有社区案例，期待你的第一个作品。
          </p>
          <a
            class="portal-button"
            href="https://github.com/cyanfish-x/tellux/issues/new"
            data-i18n="portal.community.submit"
            >提交案例</a
          >
        </div>
        <div
          class="portal-community__empty portal-community__empty--result"
          data-gallery-empty-result
          hidden
          data-i18n-attr="aria-label:gallery.emptyResultAria"
          aria-label="没有匹配的案例"
        >
          <p data-i18n="gallery.emptyResult">
            没有匹配的案例，换个关键词或标签试试。
          </p>
        </div>
        <div class="portal-community__grid portal-gallery__grid" data-gallery-grid></div>
      </section>

      <footer
        class="portal-footer"
        data-i18n-attr="aria-label:portal.footer.aria"
        aria-label="站点页脚"
      >
        <p class="portal-footer__line">
          <span>Copyright © 2026 Tellux</span>
          <span class="portal-footer__sep" aria-hidden="true">·</span>
          <a
            href="https://github.com/cyanfish-x/tellux/blob/main/LICENSE"
            target="_blank"
            rel="noopener noreferrer"
            >MIT</a
          >
          <span class="portal-footer__sep" aria-hidden="true">·</span>
          <a
            href="https://github.com/cyanfish-x/tellux"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
          <span class="portal-footer__sep" aria-hidden="true">·</span>
          <a
            href="https://github.com/cyanfish-x/tellux/releases"
            target="_blank"
            rel="noopener noreferrer"
            >Releases</a
          >
          <span class="portal-footer__sep" aria-hidden="true">·</span>
          <a
            href="https://www.npmjs.com/package/tellux"
            target="_blank"
            rel="noopener noreferrer"
            >npm</a
          >
          <span class="portal-footer__sep" aria-hidden="true">·</span>
          <span data-i18n="portal.footer.author">作者</span>
          <a href="https://cyanfish.site" target="_blank" rel="noopener noreferrer">cyanfish</a>
        </p>
        <p class="portal-footer__line">
          <span data-i18n="portal.footer.poweredBy">Powered by</span>
          <a href="https://threejs.org/" target="_blank" rel="noopener noreferrer">Three.js</a>
          <span class="portal-footer__sep" aria-hidden="true">·</span>
          <a
            href="https://github.com/NASA-AMMOS/3DTilesRendererJS"
            target="_blank"
            rel="noopener noreferrer"
            >3d-tiles-renderer</a
          >
          <span class="portal-footer__sep" aria-hidden="true">·</span>
          <a
            href="https://github.com/takram-design-engineering/three-geospatial"
            target="_blank"
            rel="noopener noreferrer"
            >Takram</a
          >
        </p>
      </footer>
    </main>
  </body>
</html>
